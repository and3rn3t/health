name = "vitalsense-websocket-advanced"
main = "dist-worker/vitalsense-websocket-advanced-clean.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "vitalsense-websocket-advanced-dev"

[[env.development.durable_objects.bindings]]
name = "VITALSENSE_WEBSOCKET"
class_name = "VitalSenseAdvancedWebSocketDO"

[env.production]
name = "vitalsense-websocket-advanced-prod"

[[env.production.durable_objects.bindings]]
name = "VITALSENSE_WEBSOCKET"
class_name = "VitalSenseAdvancedWebSocketDO"

[[durable_objects.bindings]]
name = "VITALSENSE_WEBSOCKET"
class_name = "VitalSenseAdvancedWebSocketDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VitalSenseAdvancedWebSocketDO"]

# Analytics and monitoring
[observability]
enabled = true

# Environment variables for ML configuration
[env.development.vars]
ML_CONFIDENCE_THRESHOLD = "0.75"
ANOMALY_DETECTION_SENSITIVITY = "2.5"
PREDICTION_HORIZON_DAYS = "7"
MAX_HISTORICAL_RECORDS = "1000"

[env.production.vars]
ML_CONFIDENCE_THRESHOLD = "0.80"
ANOMALY_DETECTION_SENSITIVITY = "2.0"
PREDICTION_HORIZON_DAYS = "7"
MAX_HISTORICAL_RECORDS = "1000"

# Limits for production deployment (commented out for free plan)
# [limits]
# cpu_ms = 50
