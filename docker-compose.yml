services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitalsense/worker:dev
    container_name: vitalsense-worker
    environment:
      - ENVIRONMENT=development
      - BASE_URL=http://localhost:8789
      - API_BASE_URL=http://localhost:8789/api
      - WEBSOCKET_URL=ws://localhost:3001
      - AUTH0_DOMAIN=dev-qjdpc81dzr7xrnlu.us.auth0.com
      - AUTH0_CLIENT_ID=YyCHkHZ11713YG7QsB518lHrCFE3bW1s
      - DEVICE_JWT_SECRET=dev-local
    ports:
      - '8789:8789'
    restart: unless-stopped
    depends_on:
      - websocket

  websocket:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: vitalsense/websocket:dev
    container_name: vitalsense-websocket
    environment:
      - PORT=3001
      - WS_PAGE_SIZE=25
      - WS_API_KEY=
      - DEVICE_JWT_SECRET=dev-local
      - API_ISS=health-app
      - API_AUD=ws-device
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000,http://127.0.0.1:5000,http://localhost:8789,http://127.0.0.1:8789
    ports:
      - '3001:3001'
    restart: unless-stopped

networks:
  default:
    name: vitalsense-dev
