services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-worker
    environment:
      - ENVIRONMENT=development
      - BASE_URL=http://localhost:8789
      - API_BASE_URL=http://localhost:8789/api
      - DEVICE_JWT_SECRET=dev-local
    ports:
      - '8789:8789'
    restart: unless-stopped
