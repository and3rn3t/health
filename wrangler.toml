# VitalSense Cloudflare Workers Configuration
# This is the single source of truth for all Worker deployments
# Use --env flag to select environment: development, production, websocket, advanced-websocket

name = "health-app"
main = "dist-worker/index.js"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[build]
command = "npm run build:worker"
cwd = "."
watch_dir = "src"

# Assets configuration for React app
[assets]
directory = "./dist"
binding = "ASSETS"

# ============================================================================
# Development Environment
# ============================================================================
[env.development]
name = "health-app-dev"

[env.development.vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000,http://127.0.0.1:5000"
BASE_URL = "http://localhost:8789"
API_BASE_URL = "http://localhost:8789/api"
WEBSOCKET_URL = "wss://vitalsense-websocket-advanced-dev.andernet.workers.dev/ws"
FILES_BASE_URL = "http://localhost:8789/files"
LOG_LEVEL = "debug"
LOG_SAMPLE_RATE = "0.01"
# Category-specific logging sample rates (development) - heavily reduced to prevent rate limiting
LOG_WS_SAMPLE_RATE = "0.01"                # sample 1% WS telemetry in dev
LOG_CLIENT_ERROR_SAMPLE_RATE = "0.1"       # sample 10% client errors in dev
FALL_DETECTION_THRESHOLD = "0.75"
EMERGENCY_RESPONSE_DELAY = "30"
MAX_FILE_SIZE = "100MB"
SESSION_TIMEOUT = "24h"
# Auth0 (development)
AUTH0_DOMAIN = "dev-qjdpc81dzr7xrnlu.us.auth0.com"
AUTH0_CLIENT_ID = "YyCHkHZ11713YG7QsB518lHrCFE3bW1s"
# DEVICE_JWT_SECRET: Set via `wrangler secret put DEVICE_JWT_SECRET` or .env.development.local
# SENTRY_DSN: Set via `wrangler secret put SENTRY_DSN --env development`
# Do NOT commit secrets here. See docs/security/SECRET_MANAGEMENT.md

# Development Durable Objects
[[env.development.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

# ============================================================================
# Production Environment
# ============================================================================
[env.production]
name = "health-app-prod"
workers_dev = false

[env.production.placement]
mode = "smart"

# Observability & Analytics Configuration
# Health metrics analytics
[[env.production.analytics_engine_datasets]]
binding = "HEALTH_ANALYTICS"

# Security events analytics
[[env.production.analytics_engine_datasets]]
binding = "SECURITY_ANALYTICS"

# Performance metrics analytics
[[env.production.analytics_engine_datasets]]
binding = "PERFORMANCE_ANALYTICS"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://health.andernet.dev"
BASE_URL = "https://health.andernet.dev"
API_BASE_URL = "https://health.andernet.dev/api"
WEBSOCKET_URL = "wss://ws.health.andernet.dev/ws"
FILES_BASE_URL = "https://health.andernet.dev/files"
LOG_LEVEL = "info"
LOG_SAMPLE_RATE = "0.1"
# Category-specific logging sample rates (production)
LOG_WS_SAMPLE_RATE = "0.2"                  # 20% of WS telemetry
LOG_CLIENT_ERROR_SAMPLE_RATE = "0.5"        # 50% of client errors
FALL_DETECTION_THRESHOLD = "0.85"
EMERGENCY_RESPONSE_DELAY = "30"
MAX_FILE_SIZE = "500MB"
SESSION_TIMEOUT = "12h"
ENABLE_ANALYTICS = "true"
ENABLE_SECURITY_LOGGING = "true"
ENABLE_PERFORMANCE_MONITORING = "true"
# SENTRY_DSN: Set via `wrangler secret put SENTRY_DSN --env production`
# Auth0 Configuration
AUTH0_DOMAIN = "dev-qjdpc81dzr7xrnlu.us.auth0.com"
AUTH0_CLIENT_ID = "YyCHkHZ11713YG7QsB518lHrCFE3bW1s"

# Production KV namespaces
[[env.production.kv_namespaces]]
binding = "HEALTH_KV"
id = "c3501957dd2540ccb6f624a78df59936"

# Session storage KV
[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "92783e42b1f54805be49a882bc0ef525"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "327f94aec89b473db9a4d90baa9a2923"

# Production R2 buckets for file storage
[[env.production.r2_buckets]]
binding = "HEALTH_FILES"
bucket_name = "vitalsense-health-files"

# Audit log storage with Object Lock
[[env.production.r2_buckets]]
binding = "AUDIT_LOGS"
bucket_name = "vitalsense-audit-logs"

# Production routes with zone configuration
# Main web app entry point - health.andernet.dev only
[[env.production.routes]]
pattern = "health.andernet.dev/*"
zone_name = "andernet.dev"

# Production Durable Objects
[[env.production.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Production migrations (only for main worker)
# NOTE: VitalSenseAdvancedWebSocketDO migration has been applied - removed to prevent re-application errors
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["HealthWebSocket", "VitalSenseWebSocketDO"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# ============================================================================
# WebSocket Service Environment (Basic)
# ============================================================================
[env.websocket]
name = "vitalsense-websocket-test"

[env.websocket.vars]
ENVIRONMENT = "development"

# WebSocket Durable Objects
[[env.websocket.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

# WebSocket routes (production)
[[env.websocket.routes]]
pattern = "ws.health.andernet.dev/*"
zone_name = "andernet.dev"

# ============================================================================
# Global Durable Objects (default bindings)
# ============================================================================
[[durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

# ============================================================================
# Migrations for Durable Objects
# Note: Migrations are now environment-specific to avoid conflicts
# Global migrations apply to default/main worker only
# NOTE: VitalSenseAdvancedWebSocketDO migration has been applied - removed from global migrations
# ============================================================================
# Default/main worker migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HealthWebSocket", "VitalSenseWebSocketDO"]

# Migration to add RateLimiter Durable Object (main worker only)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# ============================================================================
# Observability
# ============================================================================
[observability]
enabled = false  # Disabled to prevent Cloudflare Insights beacon injection

# ============================================================================
# Preview Environment (PR deployments)
# ============================================================================
[env.preview]
name = "health-app-preview"
workers_dev = true

[env.preview.vars]
ENVIRONMENT = "preview"
ALLOWED_ORIGINS = "*"
LOG_LEVEL = "debug"
LOG_SAMPLE_RATE = "0.5"
FALL_DETECTION_THRESHOLD = "0.75"
EMERGENCY_RESPONSE_DELAY = "30"
MAX_FILE_SIZE = "100MB"
SESSION_TIMEOUT = "24h"
AUTH0_DOMAIN = "dev-qjdpc81dzr7xrnlu.us.auth0.com"
AUTH0_CLIENT_ID = "YyCHkHZ11713YG7QsB518lHrCFE3bW1s"

[[env.preview.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["HealthWebSocket", "VitalSenseWebSocketDO"]

[[env.preview.migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# ── Advanced-dev WebSocket worker ────────────────────────────────────────────
# Matches the Cloudflare-managed worker "vitalsense-websocket-advanced-dev"
# connected to this repo via the Cloudflare GitHub integration.
[env.advanced-dev]
name = "vitalsense-websocket-advanced-dev"

[env.advanced-dev.vars]
ENVIRONMENT = "development"
LOG_LEVEL = "debug"

[[env.advanced-dev.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

[[env.advanced-dev.migrations]]
tag = "v1"
new_sqlite_classes = ["HealthWebSocket"]
