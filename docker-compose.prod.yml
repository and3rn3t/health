version: '3.8'

services:
  # Production build service
  build:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: builder
    image: vitalsense:build
    volumes:
      - ./dist:/app/dist
      - ./dist-worker:/app/dist-worker
    command: sh -c "echo 'Build complete' && ls -la dist dist-worker"

  # Production deployment service (uses built artifacts)
  deploy:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    image: vitalsense:production
    environment:
      - NODE_ENV=production
    # This service would typically be used to extract artifacts
    # or run deployment scripts
    command: sh -c "echo 'Production image ready' && ls -la dist dist-worker"

