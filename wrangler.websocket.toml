name = "vitalsense-websocket-test"
main = "src/websocket-worker.ts"
compatibility_date = "2024-08-30"
compatibility_flags = ["nodejs_compat"]

[env.development]
name = "vitalsense-websocket-dev"

[env.development.vars]
ENVIRONMENT = "development"

# Durable Objects for WebSocket
[[env.development.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

# Migrations for Durable Objects (SQLite for free plan)
[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = [ "HealthWebSocket" ]

[env.production]
name = "vitalsense-websocket-prod"

[env.production.vars]
ENVIRONMENT = "production"

# Production routes - using subdomain for WebSocket service
[[env.production.routes]]
pattern = "ws.health.andernet.dev/*"
zone_name = "andernet.dev"

# Durable Objects for WebSocket
[[env.production.durable_objects.bindings]]
name = "HEALTH_WEBSOCKET"
class_name = "HealthWebSocket"

# Migrations for Durable Objects (SQLite for free plan)
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = [ "HealthWebSocket" ]