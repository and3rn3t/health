# SonarCloud configuration for VitalSense
sonar.projectKey=and3rn3t_health
sonar.organization=and3rn3t

# Source configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Source exclusions — non-runtime, generated, and demo files
sonar.exclusions=\
  **/node_modules/**,\
  dist/**,\
  dist-worker/**,\
  public/**,\
  scripts/**,\
  ios/**,\
  **/*.d.ts,\
  src/lib/demo-data.ts,\
  src/components/**/experimental/**,\
  src/components/**/infrastructure/**,\
  src/components/**/unused-health/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**,\
  src/components/**/experimental/**,\
  src/components/**/infrastructure/**,\
  src/lib/demo-data.ts

# Duplication exclusions — demo/simulation files with intentionally repetitive patterns
sonar.cpd.exclusions=\
  src/lib/demo-data.ts,\
  src/worker/routes/demo.ts,\
  src/components/**/LiDARGaitAnalyzerClean.tsx,\
  src/components/**/WalkingPatternVisualizerClean.tsx,\
  src/components/health/lidar/CompleteLiDARIntegration.tsx,\
  src/components/health/lidar/AdvancedLiDARAnalytics.tsx,\
  src/components/health/lidar/RealDataLiDARIntegration.tsx
