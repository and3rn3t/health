sonar.projectKey=and3rn3t_health
sonar.organization=and3rn3t
sonar.sources=src
sonar.exclusions=dist/**,node_modules/**,ios/**,docs/**,src/_archive/**,scripts/_archive/**,*.test.ts,*.test.tsx,*.spec.ts,*.spec.tsx,src/__tests__/**,scripts/ci/sonar-*.mjs,scripts/**

# Exclude scripts directory from analysis (these are build/dev tools, not production code)
sonar.coverage.exclusions=scripts/**,src/__tests__/**,*.test.ts,*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Quality Gate Settings
sonar.qualitygate.wait=true

# Duplication Settings
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/_archive/**,scripts/_archive/**

# Security Hotspot Exclusions (for known safe patterns)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S138
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*worker*.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2225
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*worker*.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S4818
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*worker*.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.test.tsx
# Exclude console.log in scripts (build/dev tools)
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.e6.resourceKey=scripts/**
# Exclude dangerouslySetInnerHTML in chart.tsx (sanitized)
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6654
sonar.issue.ignore.multicriteria.e7.resourceKey=**/chart.tsx
# Exclude console.log in worker.ts (Workers runtime + client-side embedded scripts with NOSONAR)
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.e8.resourceKey=**/worker.ts
