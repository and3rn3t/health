<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      🚨 TEST MODE - VitalSense - Apple Health Insights & Fall Risk Monitor
    </title>

    <!-- Standard favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="background-color" content="#ffffff" />
    <meta name="display" content="standalone" />
    <meta name="orientation" content="portrait-primary" />

    <!-- Apple-specific PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VitalSense" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/icons/icon-192x192.png"
    />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- SEO and Social Meta Tags -->
    <meta
      name="description"
      content="Your comprehensive health companion with advanced analytics, fall risk monitoring, and emergency safety features. Track Apple Health data with AI-powered insights."
    />
    <meta
      name="keywords"
      content="health monitoring, fall risk, Apple Health, health analytics, safety, elderly care, fitness tracking"
    />
    <meta name="author" content="VitalSense Health Technologies" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="VitalSense - Apple Health Insights & Fall Risk Monitor"
    />
    <meta
      property="og:description"
      content="Your comprehensive health companion with advanced analytics and safety monitoring"
    />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:url" content="https://health.andernet.dev" />
    <meta property="og:site_name" content="VitalSense" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VitalSense - Apple Health Insights & Fall Risk Monitor"
    />
    <meta
      name="twitter:description"
      content="Your comprehensive health companion with advanced analytics and safety monitoring"
    />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/main.css" />
    <!-- VitalSense consolidated styles -->
    <script>
      (function () {
        try {
          var u = new URL(window.location.href);
          var hasCode = u.searchParams.has('code');
          var hasState = u.searchParams.has('state');
          if ((hasCode || hasState) && u.pathname !== '/callback') {
            window.location.replace('/callback' + u.search);
          }
        } catch (e) {
          // swallow early redirect normalization errors but log
          try {
            console.debug(
              'redirect-normalize failed',
              e && e.message ? e.message : e
            );
          } catch {}
        }
      })();
    </script>
    <script>
      // Load runtime app config without letting Vite try to bundle it
      (function () {
        try {
          var s = document.createElement('script');
          s.src = '/app-config.js';
          s.async = true;
          document.head.appendChild(s);
        } catch (e) {
          try {
            console.debug(
              'app-config loader failed',
              e && e.message ? e.message : e
            );
          } catch {}
        }
      })();
    </script>
    <script>
      // Inline fallbacks to avoid race conditions before app-config.js loads
      (function () {
        try {
          // Prefer local KV mode by default; /app-config.js may override
          // eslint-disable-next-line no-var
          var BASE_KV_SERVICE_URL = '';
          // Expose on window for libraries that read from globals
          window.BASE_KV_SERVICE_URL = BASE_KV_SERVICE_URL;
          window.__VITALSENSE_KV_MODE = 'local';
          // Auto-disable WS on demo routes
          if (location.pathname.indexOf('/demo') === 0) {
            window.VITALSENSE_DISABLE_WEBSOCKET = true;
          }
        } catch (e) {
          try {
            console.debug(
              'inline-fallback failed',
              e && e.message ? e.message : e
            );
          } catch {}
        }
      })();
    </script>
  </head>

  <body>
    <div id="spark-app" class="min-h-screen bg-background text-foreground">
      <div id="root"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
