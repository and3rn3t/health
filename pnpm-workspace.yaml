onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - sharp
  - workerd

allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: true
  workerd: true

auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    # zod 3.x pulled in by @tanstack/router-generator (build-time only, needs the v3 API;
    # forcing zod 4 breaks `vite build`). No 3.x patch exists; app code uses zod >=4.6.6.
    - GHSA-mrhx-c7xc-m3w5

