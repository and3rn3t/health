name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🏥 Health & Safety'
    labels:
      - 'health'
      - 'security'
      - 'hipaa'
  - title: '📱 iOS'
    labels:
      - 'ios'
      - 'swift'
      - 'healthkit'
  - title: '☁️ Worker / Backend'
    labels:
      - 'worker'
      - 'backend'
      - 'cloudflare'
  - title: '🧪 Testing'
    labels:
      - 'test'
      - 'testing'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'docs'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bugfix'
      - 'chore'
      - 'dependencies'
  default: patch

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.*\))?:/i'
  - label: 'test'
    title:
      - '/^test(\(.*\))?:/i'
  - label: 'ios'
    files:
      - 'ios/**'
  - label: 'worker'
    files:
      - 'src/worker/**'
  - label: 'dependencies'
    files:
      - 'package.json'
      - 'pnpm-lock.yaml'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
