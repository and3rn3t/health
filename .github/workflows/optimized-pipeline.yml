name: Optimized CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096
  FORCE_COLOR: 3

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      webapp: ${{ steps.changes.outputs.webapp }}
      ios: ${{ steps.changes.outputs.ios }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            webapp:
              - 'src/**'
              - 'scripts/**'
              - 'package*.json'
              - 'vite*.config.ts'
              - 'tsconfig*.json'
              - 'tailwind.config.js'
              - 'wrangler*.toml'
            ios:
              - 'ios/**'
              - '.github/workflows/ios-tests.yml'
            docs:
              - 'docs/**'
              - '*.md'

  webapp-lint:
    name: Web App • Lint & Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies (fast)
        run: npm ci --prefer-offline --silent
      - name: Lint Code
        run: npm run lint
      - name: Format Check
        run: npm run format:check

  webapp-typecheck:
    name: Web App • Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies (fast)
        run: npm ci --prefer-offline --silent
      - name: Type Check
        run: npm run build:app

  webapp-build:
    name: Web App • Build (Worker + App)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies (fast)
        run: |
          npm ci --prefer-offline --silent
          cd scripts/node && npm ci --prefer-offline --silent
      - name: Build Worker
        run: npm run build:worker
      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
      - name: Verify Build Outputs
        run: |
          echo "=== Build verification ==="
          if [ -d "dist/" ]; then ls -la dist/; else echo "❌ dist/ directory not found"; fi
          if [ -d "dist-worker/" ]; then ls -la dist-worker/; else echo "❌ dist-worker/ directory not found"; fi
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node20
          path: |
            dist/
            dist-worker/
          retention-days: 7
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- App bundle: $(ls -1 dist 2>/dev/null | wc -l) files" >> $GITHUB_STEP_SUMMARY
          echo "- Worker bundle: $(ls -1 dist-worker 2>/dev/null | wc -l) files" >> $GITHUB_STEP_SUMMARY

  webapp-tests:
    name: Web App • Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, webapp-build]
    if: needs.changes.outputs.webapp == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies (fast)
        run: npm ci --prefer-offline --silent
      - name: Download Build Artifacts (for tests)
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node20
      - name: Run Tests
        run: |
          mkdir -p test-results
          npm run test
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-node20
          path: |
            coverage/
            test-results/
          retention-days: 7

  docs-ci:
    name: Docs • Lint & Links
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Markdown Lint
        uses: avto-dev/markdown-lint@v1
        with:
          args: |
            docs/**/*.md
            *.md
      - name: Link Check (external)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose ./docs/**/*.md ./README.md

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [changes, webapp-build, webapp-tests]
    if: needs.changes.outputs.webapp == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify esbuild installation
        run: |
          echo "Checking esbuild installation..."
          npm list esbuild || echo "esbuild not found in npm list"
          ls -la node_modules/.bin/esbuild || echo "esbuild binary not found"
          if [ ! -f node_modules/.bin/esbuild ]; then
            echo "Installing esbuild..."
            npm install esbuild@latest
          fi

      - name: Health Check
        run: |
          echo "Starting health check..."
          npx wrangler dev --local --port 8787 --var DEVICE_JWT_SECRET:ci &
          WRANGLER_PID=$!

          # Wait for health endpoint
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "✅ Health check passed"
              kill $WRANGLER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done

          echo "❌ Health check failed"
          kill $WRANGLER_PID 2>/dev/null || true
          exit 1

  ios-ci:
    name: iOS CI
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/**') }}

      - name: Cache Xcode Derived Data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ios/build
          key: xcode-${{ runner.os }}-${{ hashFiles('ios/**/*.swift', 'ios/**/*.plist') }}

      - name: Install Tools
        run: |
          brew list swiftlint &>/dev/null || brew install swiftlint

      - name: Swift Lint
        working-directory: ios
        continue-on-error: true
        run: |
          swiftlint lint --reporter github-actions-logging --cache-path .swiftlint-cache --lenient

      - name: Build iOS App
        run: |
          cd ios

          echo "Building iOS app with improved SDK approach..."

          # List available simulators for debugging
          echo "Available iOS Simulators:"
          xcrun simctl list devices iOS | grep -E "(iPhone|iPad)" | head -3

          # Try multiple build approaches with detailed error output
          xcodebuild clean build \
            -project HealthKitBridge.xcodeproj \
            -scheme HealthKitBridge \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=YES \
            OTHER_SWIFT_FLAGS="-D DEBUG" || {
              echo "Build failed, trying simplified approach..."
              xcodebuild clean build \
                -project HealthKitBridge.xcodeproj \
                -scheme HealthKitBridge \
                -sdk iphonesimulator \
                -configuration Debug \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGNING_REQUIRED=NO \
                ENABLE_BITCODE=NO
            }

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [changes, webapp-build, webapp-tests, smoke-test]
    if: |
      needs.changes.outputs.webapp == 'true' &&
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node20

      - name: Deploy to Development
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env development
          packageManager: npm

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [changes, webapp-build, webapp-tests, smoke-test]
    if: |
      needs.changes.outputs.webapp == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node20

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          packageManager: npm

      - name: Post-Deployment Health Check
        run: |
          sleep 30 # Allow deployment to settle
          # Add your production health check URL here
          # curl -fsS https://your-production-domain.com/health || exit 1
          echo "Production deployment completed - manual health check recommended"
