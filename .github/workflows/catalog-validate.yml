name: Catalog Schema Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'schemas/**'
      - 'catalog/**'
      - 'scripts/ci/catalog-validate.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'catalog/**'
      - 'scripts/ci/catalog-validate.js'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog schemas
        run: pnpm run ci:catalog
