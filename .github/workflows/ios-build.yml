name: Andernet Posture iOS Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - release
          - performance
          - posture
          - all
      run_tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      upload_testflight:
        description: 'Upload to TestFlight (main branch only)'
        required: false
        default: false
        type: boolean
      skip_codesigning:
        description: 'Skip code signing (for unsigned builds)'
        required: false
        default: true
        type: boolean

concurrency:
  group: ios-build-${{ github.ref }}-${{ github.event.inputs.build_type || 'default' }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'development' }}
      RUN_TESTS: ${{ github.event.inputs.run_tests != 'false' }}
      UPLOAD_TESTFLIGHT: ${{ github.event.inputs.upload_testflight == 'true' && github.ref == 'refs/heads/main' }}
      SKIP_CODESIGNING: ${{ github.event.inputs.skip_codesigning != 'false' }}
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER || 'dev.andernet.posture.Andernet-Posture' }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
      XCODE_PATH: /Applications/Xcode_26.2.app/Contents/Developer
      SCHEME: "Andernet Posture"
      PROJECT: "Andernet Posture.xcodeproj"
      WORK_DIR: ios/Andernet-Posture

    defaults:
      run:
        working-directory: ios/Andernet-Posture

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Cache Ruby gems
        uses: actions/cache@v5
        with:
          path: ios/vendor/bundle
          key: ${{ runner.os }}-ruby-${{ hashFiles('ios/Gemfile', 'ios/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-

      - name: Install Ruby dependencies
        working-directory: ios
        run: |
          bundle config set --local deployment 'false'
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Cache derived data
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('ios/Andernet-Posture/**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -quiet || echo "Package resolution completed with warnings"

      - name: Determine build lane
        id: build_lane
        run: |
          case "$BUILD_TYPE" in
            development)
              echo "lane=build_optimized" >> $GITHUB_OUTPUT
              echo "test_lane=tests" >> $GITHUB_OUTPUT
              ;;
            release)
              echo "lane=archive" >> $GITHUB_OUTPUT
              echo "test_lane=tests" >> $GITHUB_OUTPUT
              ;;
            performance)
              echo "lane=build_posture" >> $GITHUB_OUTPUT
              echo "test_lane=performance_test" >> $GITHUB_OUTPUT
              ;;
            posture)
              echo "lane=build_posture" >> $GITHUB_OUTPUT
              echo "test_lane=tests" >> $GITHUB_OUTPUT
              ;;
            all)
              echo "lane=build_optimized" >> $GITHUB_OUTPUT
              echo "test_lane=tests" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "lane=build_optimized" >> $GITHUB_OUTPUT
              echo "test_lane=tests" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run linting
        continue-on-error: true
        working-directory: ios
        run: |
          bundle exec fastlane ios lint || echo "Linting completed with warnings"

      - name: Build iOS app
        id: build
        working-directory: ios
        run: |
          echo "Building Andernet Posture iOS app..."
          echo "Build Lane: ${{ steps.build_lane.outputs.lane }}"

          set +e

          BUILD_START_TIME=$(date +%s)

          if bundle exec fastlane ios ${{ steps.build_lane.outputs.lane }}; then
            BUILD_END_TIME=$(date +%s)
            BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
            echo "Build successful (${BUILD_DURATION}s)"
            echo "success=true" >> $GITHUB_OUTPUT
            echo "duration=${BUILD_DURATION}" >> $GITHUB_OUTPUT
          else
            BUILD_EXIT_CODE=$?
            echo "Main build failed (exit $BUILD_EXIT_CODE), trying fallback..."

            if [ -f "../Andernet-Posture/scripts/fallback-build.sh" ]; then
              chmod +x "../Andernet-Posture/scripts/fallback-build.sh"
              BUILD_START_TIME=$(date +%s)
              if (cd "../Andernet-Posture" && bash scripts/fallback-build.sh); then
                BUILD_END_TIME=$(date +%s)
                BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
                echo "Fallback build successful (${BUILD_DURATION}s)"
                echo "success=true" >> $GITHUB_OUTPUT
                echo "duration=${BUILD_DURATION}" >> $GITHUB_OUTPUT
              else
                echo "Both main and fallback builds failed"
                echo "success=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            else
              echo "success=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      - name: Run tests
        if: steps.build.outputs.success == 'true' && env.RUN_TESTS == 'true'
        continue-on-error: true
        working-directory: ios
        run: |
          TEST_START_TIME=$(date +%s)

          if bundle exec fastlane ios ${{ steps.build_lane.outputs.test_lane }}; then
            TEST_END_TIME=$(date +%s)
            echo "Tests passed ($((TEST_END_TIME - TEST_START_TIME))s)"
            echo "TEST_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "Tests failed, but continuing..."
            echo "TEST_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Generate build metrics
        if: always()
        run: |
          mkdir -p build
          cat > build_metrics.json << JSON
          {
            "app": "Andernet Posture",
            "build_type": "$BUILD_TYPE",
            "build_success": ${{ steps.build.outputs.success == 'true' }},
            "build_duration_seconds": ${{ steps.build.outputs.duration || 0 }},
            "test_success": ${{ env.TEST_SUCCESS == 'true' }},
            "xcode_version": "$(xcodebuild -version | head -1 | sed 's/Xcode //')",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          JSON
          cat build_metrics.json

      - name: Verify build artifacts
        if: steps.build.outputs.success == 'true'
        run: |
          if [ -d "build" ]; then
            echo "Build artifacts:"
            find build -type f \( -name "*.xcarchive" -o -name "*.ipa" -o -name "*.app" \) 2>/dev/null | head -10
            du -sh build/* 2>/dev/null | head -10 || true
          else
            echo "No build directory found"
          fi

      - name: Upload to TestFlight
        if: steps.build.outputs.success == 'true' && env.UPLOAD_TESTFLIGHT == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: ios
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_PATH" ] && [ -z "$FASTLANE_USER" ]; then
            echo "TestFlight credentials not configured, skipping upload"
            exit 0
          fi

          if [ -n "$APP_STORE_CONNECT_API_KEY_PATH" ]; then
            echo "$APP_STORE_CONNECT_API_KEY_PATH" | base64 -d > /tmp/api_key.json
            export APP_STORE_CONNECT_API_KEY_PATH=/tmp/api_key.json
          fi

          bundle exec fastlane ios beta || echo "TestFlight upload failed, but build succeeded"

      - name: Upload build artifacts
        if: steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: andernet-posture-build-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: |
            ios/Andernet-Posture/build/
            ios/Andernet-Posture/build_metrics.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            ios/fastlane/test_output/
            ios/fastlane/performance_results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          echo "Build Type: $BUILD_TYPE"
          echo "Build Status: ${{ steps.build.outputs.success == 'true' && 'SUCCESS' || 'FAILED' }}"
          echo "Test Status: ${{ env.TEST_SUCCESS == 'true' && 'PASSED' || env.TEST_SUCCESS == 'false' && 'FAILED' || 'SKIPPED' }}"
          echo "TestFlight: ${{ env.UPLOAD_TESTFLIGHT == 'true' && 'UPLOADED' || 'SKIPPED' }}"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Commit: ${{ github.sha }}"

  notify-completion:
    needs: build-ios
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build status notification
        run: |
          echo "Andernet Posture iOS build completed"
          echo "Status: ${{ needs.build-ios.result }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
