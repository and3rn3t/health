name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/Andernet-Posture/**'
      - '.github/workflows/ios-ci.yml'
      - '.github/actions/setup-ios/**'
  pull_request:
    branches: [main]
    paths:
      - 'ios/Andernet-Posture/**'
      - '.github/workflows/ios-ci.yml'
      - '.github/actions/setup-ios/**'
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip linting step'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean
      skip_archive:
        description: 'Skip archive step'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "Andernet Posture"
  PROJECT: "Andernet Posture.xcodeproj"
  DESTINATION: "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest"
  WORK_DIR: ios/Andernet-Posture

defaults:
  run:
    working-directory: ios/Andernet-Posture

jobs:
  # ─── SwiftLint on cheap ubuntu runner (~30s vs ~2min on macOS) ───
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    if: inputs.skip_lint != true
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint (strict)
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict
        env:
          WORKING_DIRECTORY: ios/Andernet-Posture

  # ─── Unit tests (every push & PR, ~2min) ───
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    needs: swiftlint
    if: |
      always()
      && (needs.swiftlint.result == 'success' || needs.swiftlint.result == 'skipped')
      && inputs.skip_tests != true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing "Andernet PostureTests" \
            -resultBundlePath UnitTestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTestResults
          path: ${{ env.WORK_DIR }}/UnitTestResults.xcresult

  # ─── Smoke UI tests (PRs only, ~2min) ───
  smoke-ui-tests:
    name: Smoke UI Tests
    runs-on: macos-15
    needs: swiftlint
    if: |
      github.event_name == 'pull_request'
      && (needs.swiftlint.result == 'success' || needs.swiftlint.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios

      - name: Run smoke UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing "Andernet PostureUITests" \
            -resultBundlePath SmokeTestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SmokeTestResults
          path: ${{ env.WORK_DIR }}/SmokeTestResults.xcresult

  # ─── Full suite + coverage (main push only, non-blocking) ───
  full-suite:
    name: Full Suite + Coverage
    runs-on: macos-15
    needs: swiftlint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    outputs:
      coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios

      - name: Run full test suite with coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing "Andernet PostureTests" \
            -enableCodeCoverage YES \
            -resultBundlePath FullSuiteResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Extract coverage
        id: coverage
        if: always()
        run: |
          set +e
          RESULT="FullSuiteResults.xcresult"
          [ ! -d "$RESULT" ] && echo "No xcresult" && exit 0
          xcrun xccov view --report --json "$RESULT" > coverage.json 2>/dev/null || exit 0
          TOTAL=$(python3 -c "
          import json
          try:
              data = json.load(open('coverage.json'))
              cov = [t.get('lineCoverage', 0) for t in data.get('targets', []) if t.get('name') != 'Andernet PostureUITests']
              print(round(sum(cov) / len(cov) * 100, 2) if cov else 0)
          except Exception:
              print(0)
          ")
          echo "Line Coverage: ${TOTAL}%"
          echo "coverage_percent=${TOTAL}" >> $GITHUB_OUTPUT

      - name: Coverage gate (min 40%)
        if: always() && steps.coverage.outputs.coverage_percent != ''
        run: |
          COV="${{ steps.coverage.outputs.coverage_percent }}"
          awk -v c="$COV" -v m=40 'BEGIN { if (c+0 < m) { printf("Coverage %.2f%% below minimum %d%%\n", c, m); exit 1 } }'
          echo "Coverage gate passed (${COV}% >= 40%)"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FullSuiteResults
          path: |
            ${{ env.WORK_DIR }}/FullSuiteResults.xcresult
            ${{ env.WORK_DIR }}/coverage.json
          retention-days: 7

  # ─── Archive (main push or manual, requires passing tests) ───
  archive:
    name: Archive (Release)
    runs-on: macos-15
    needs: [unit-tests, full-suite]
    if: |
      always()
      && inputs.skip_archive != true
      && (github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push'))
      && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios

      - name: Archive (Release, unsigned)
        run: |
          set -e
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/AndernetPosture.xcarchive \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO SKIP_INSTALL=NO
          test -d "build/AndernetPosture.xcarchive" || { echo "Archive failed"; exit 1; }

      - name: Export IPA (ad-hoc unsigned)
        run: |
          set -e
          mkdir -p build/export
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/AndernetPosture.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist || echo "Export may have partial artifacts"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: |
            ${{ env.WORK_DIR }}/build/AndernetPosture.xcarchive
            ${{ env.WORK_DIR }}/build/export
          retention-days: 14

  # ─── TestFlight upload (main push, after archive, requires signing secrets) ───
  testflight:
    name: TestFlight Upload
    runs-on: macos-15
    needs: [archive]
    if: |
      needs.archive.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
    environment: ios-testflight
    defaults:
      run:
        working-directory: ios/Andernet-Posture
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios

      - name: Install Fastlane
        working-directory: ios
        run: |
          bundle config set --local deployment 'false'
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_PATH" ]; then
            echo "::warning::APP_STORE_CONNECT_API_KEY_PATH not set. Configure secrets to enable TestFlight."
            exit 0
          fi
          echo "$APP_STORE_CONNECT_API_KEY_PATH" | base64 -d > /tmp/api_key.json
          export APP_STORE_CONNECT_API_KEY_PATH=/tmp/api_key.json
          bundle exec fastlane ios beta

  # ─── Summary (cheap ubuntu, always runs) ───
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [swiftlint, unit-tests, smoke-ui-tests, full-suite, archive, testflight]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Generate summary
        run: |
          declare -A LABELS=(
            [swiftlint]="SwiftLint"
            [unit-tests]="Unit Tests"
            [smoke-ui-tests]="Smoke UI Tests"
            [full-suite]="Full Suite"
            [archive]="Archive"
            [testflight]="TestFlight"
          )
          declare -A RESULTS=(
            [swiftlint]="${{ needs.swiftlint.result }}"
            [unit-tests]="${{ needs.unit-tests.result }}"
            [smoke-ui-tests]="${{ needs.smoke-ui-tests.result }}"
            [full-suite]="${{ needs.full-suite.result }}"
            [archive]="${{ needs.archive.result }}"
            [testflight]="${{ needs.testflight.result }}"
          )

          echo '## iOS CI Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for job in swiftlint unit-tests smoke-ui-tests full-suite archive testflight; do
            R="${RESULTS[$job]}"
            case "$R" in
              success) ICON="✅" ;;
              skipped) ICON="⏭️" ;;
              *)       ICON="❌"; FAILED=1 ;;
            esac
            echo "- ${LABELS[$job]}: ${ICON} ${R}" >> $GITHUB_STEP_SUMMARY
          done

          COV="${{ needs.full-suite.outputs.coverage_percent }}"
          [ -n "$COV" ] && echo "- Coverage: ${COV}%" >> $GITHUB_STEP_SUMMARY

          echo '' >> $GITHUB_STEP_SUMMARY
          if [ $FAILED -eq 1 ]; then
            echo '### ❌ One or more stages failed' >> $GITHUB_STEP_SUMMARY
          else
            echo '### ✅ All executed stages passed' >> $GITHUB_STEP_SUMMARY
          fi
