name: iOS CI (Lint, Build, Test, Archive)

on:
  workflow_dispatch:
    inputs:
      skip_lint:
        description: 'Skip linting step'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean
      skip_archive:
        description: 'Skip archive step'
        required: false
        default: false
        type: boolean

env:
  XCODE_VERSION: '26.2'
  SCHEME: "Andernet Posture"
  PROJECT: "Andernet Posture.xcodeproj"
  WORK_DIR: ios/Andernet-Posture
  ARCHIVE_PATH: ios/Andernet-Posture/build/AndernetPosture.xcarchive
  EXPORT_PATH: ios/Andernet-Posture/build/export

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    permissions:
      contents: read
    if: github.event.inputs.skip_lint != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('ios/Andernet-Posture/.swiftlint.yml') }}
      - name: Install SwiftLint / swift-format
        run: |
          brew install swiftlint || true
          brew install swift-format || true
      - name: Run SwiftLint (fail on errors)
        id: swiftlint
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          echo 'Running SwiftLint strict mode'
          swiftlint lint --reporter github-actions-logging > swiftlint.log || true
          # Count errors (lines starting with Error: or containing 'error:' tokens from reporter)
          ERROR_COUNT=$(grep -Ei 'error:' swiftlint.log | wc -l | tr -d ' ' || echo 0)
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "SwiftLint error count: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo 'SwiftLint errors detected:'
            cat swiftlint.log
            exit 1
          fi
      - name: Upload SwiftLint Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-log
          path: ${{ env.WORK_DIR }}/swiftlint.log
          retention-days: 7

  build-test:
    name: Build & Test (Debug)
    runs-on: macos-15
    permissions:
      contents: read
    needs: lint
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && github.event.inputs.skip_tests != 'true'
    outputs:
      coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            ${{ env.WORK_DIR }}/build
          key: dd-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Andernet-Posture/**/*.xcodeproj/project.pbxproj') }}
      - name: Resolve Dependencies
        working-directory: ${{ env.WORK_DIR }}
        run: |
          xcodebuild -resolvePackageDependencies -project "${{ env.PROJECT }}" -scheme "${{ env.SCHEME }}"
      - name: Build for Testing (Debug)
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          xcodebuild build-for-testing \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -derivedDataPath build \
            -configuration Debug \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES
      - name: Run Unit Tests
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          xcodebuild test-without-building \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -derivedDataPath build \
            -only-testing "Andernet PostureTests" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO || EXIT_CODE=$?
          # Allow test failures to still collect artifacts but fail job
          if [ ! -z "$EXIT_CODE" ]; then
            echo "Tests reported non-zero exit ($EXIT_CODE)"; exit $EXIT_CODE; fi
      - name: Extract Coverage (Best Effort)
        id: coverage
        if: always()
        run: |
          set +e
          RESULT=$(ls ${{ env.WORK_DIR }}/build/Logs/Test/*.xcresult 2>/dev/null | head -1)
          if [ -z "$RESULT" ]; then echo "No xcresult found"; exit 0; fi
          xcrun xccov view --report --json "$RESULT" > coverage.json 2>/dev/null || { echo "xccov JSON unavailable"; exit 0; }
          TOTAL=$(python3 -c "import json;\nimport sys;\nimport math;\n\ntry:\n data=json.load(open('coverage.json'));\n cov=[t.get('lineCoverage',0) for t in data.get('targets',[]) if t.get('name')!='Andernet PostureUITests'];\n print(round(sum(cov)/len(cov)*100,2) if cov else 0)\nexcept Exception:\n print(0)")
          echo "Line Coverage: ${TOTAL}%"
          echo "coverage_percent=${TOTAL}" >> $GITHUB_OUTPUT
      - name: Upload Coverage JSON
        if: always() && steps.coverage.outputs.coverage_percent != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-json
          path: coverage.json
          retention-days: 7
      - name: Coverage Gate (Min 40%)
        if: always()
        run: |
          RESULT=$(ls ${{ env.WORK_DIR }}/build/Logs/Test/*.xcresult 2>/dev/null | head -1)
          if [ -z "$RESULT" ]; then echo "Skipping coverage gate (no results)"; exit 0; fi
          COV=$(xcrun xccov view --report --json "$RESULT" | python3 -c "import sys,json;\n\nimport math;\n\ntry:\n data=json.load(sys.stdin);\n cov=[t.get('lineCoverage',0) for t in data.get('targets',[]) if t.get('name')!='Andernet PostureUITests'];\n print(round(sum(cov)/len(cov)*100,2) if cov else 0)\nexcept Exception:\n print(0)")
          echo "Computed coverage: ${COV}%"
          MIN=40
          awk -v c=$COV -v m=$MIN 'BEGIN { if (c+0 < m) { printf("Coverage %.2f%% below minimum %d%%\n", c, m); exit 1 } }'
          echo "Coverage gate passed (>= ${MIN}%)"
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: ${{ env.WORK_DIR }}/build/Logs/Test/*.xcresult
          retention-days: 7

  archive-release:
    name: Archive & Export (Release IPA)
    runs-on: macos-15
    permissions:
      contents: read
    needs: build-test
    if: always() && (needs.build-test.result == 'success' || needs.build-test.result == 'skipped') && github.event.inputs.skip_archive != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Cache DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            ${{ env.WORK_DIR }}/build
          key: archive-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Andernet-Posture/**/*.xcodeproj/project.pbxproj') }}
      - name: Archive (Release)
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          xcodebuild archive \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -archivePath build/AndernetPosture.xcarchive \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO SKIP_INSTALL=NO || EXIT_CODE=$?
          if [ ! -d "build/AndernetPosture.xcarchive" ]; then echo 'Archive failed'; exit 1; fi
      - name: Export IPA (Ad-hoc Unsigned)
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          mkdir -p build/export
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/AndernetPosture.xcarchive -exportPath build/export -exportOptionsPlist exportOptions.plist || echo 'Export may have partial artifacts'
          ls -la build/export || true
      - name: Upload Archive Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.EXPORT_PATH }}
          retention-days: 14

  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, build-test, archive-release]
    if: always()
    outputs:
      lint_result: ${{ needs.lint.result }}
      build_test_result: ${{ needs.build-test.result }}
      archive_result: ${{ needs.archive-release.result }}
      coverage: ${{ needs.build-test.outputs.coverage_percent || 'n/a' }}
    steps:
      - name: CI Summary
        run: |
          echo '## iOS CI Summary' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY

          # Lint status
          if [ "${{ needs.lint.result }}" = "skipped" ]; then
            echo '- Lint: ⏭️ Skipped' >> $GITHUB_STEP_SUMMARY
          else
            echo "- Lint: ${{ needs.lint.result == 'success' && '✅' || '❌' }} ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Build & Test status
          if [ "${{ needs.build-test.result }}" = "skipped" ]; then
            echo '- Build & Test: ⏭️ Skipped' >> $GITHUB_STEP_SUMMARY
            echo '- Coverage: N/A (tests skipped)' >> $GITHUB_STEP_SUMMARY
          else
            echo "- Build & Test: ${{ needs.build-test.result == 'success' && '✅' || '❌' }} ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ needs.build-test.outputs.coverage_percent }}" ] && [ "${{ needs.build-test.outputs.coverage_percent }}" != "n/a" ]; then
              cov=${{ needs.build-test.outputs.coverage_percent }}
              echo "- Coverage: ${cov}%" >> $GITHUB_STEP_SUMMARY
              awk -v c=$cov -v m=40 'BEGIN { if (c+0 < m) { print "- Coverage Gate: ❌ (" c "% < " m "%)" } else { print "- Coverage Gate: ✅ (" c "% >= " m "%)" } }' >> $GITHUB_STEP_SUMMARY
            else
              echo '- Coverage: N/A' >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Archive status
          if [ "${{ needs.archive-release.result }}" = "skipped" ]; then
            echo '- Archive: ⏭️ Skipped' >> $GITHUB_STEP_SUMMARY
          else
            echo "- Archive: ${{ needs.archive-release.result == 'success' && '✅' || '❌' }} ${{ needs.archive-release.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Overall status
          LINT_RESULT="${{ needs.lint.result }}"
          BUILD_RESULT="${{ needs.build-test.result }}"
          ARCHIVE_RESULT="${{ needs.archive-release.result }}"

          FAILED=0
          if [ "$LINT_RESULT" != "success" ] && [ "$LINT_RESULT" != "skipped" ]; then FAILED=1; fi
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then FAILED=1; fi
          if [ "$ARCHIVE_RESULT" != "success" ] && [ "$ARCHIVE_RESULT" != "skipped" ]; then FAILED=1; fi

          if [ $FAILED -eq 1 ]; then
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '### ❌ One or more critical stages failed' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '### ✅ All executed stages passed' >> $GITHUB_STEP_SUMMARY
          fi
