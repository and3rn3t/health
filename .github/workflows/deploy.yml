name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/node/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/node/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'

env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            webapp:
              - 'src/**'
              - 'public/**'
              - 'server/**'
              - 'scripts/node/**'
              - 'wrangler.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config*.ts'
              - 'tsconfig*.json'

  test:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    outputs:
      should-deploy-dev: ${{ steps.check-deploy.outputs.should-deploy-dev }}
      should-deploy-prod: ${{ steps.check-deploy.outputs.should-deploy-prod }}
    if: needs.changes.outputs.webapp == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline
          # Install Node.js script dependencies
          cd scripts/node && npm ci --prefer-offline
          # Install platform-specific packages for Linux builds
          cd ../..
          npm install lightningcss-linux-x64-gnu @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --save-optional

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            dist-worker/
            node_modules/.cache/
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'scripts/**/*') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-

      - name: Run linting
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Branding audit (combined)
        run: |
          npx -y wrangler@4.38.0 dev --env development --local --port 8787 --var DEVICE_JWT_SECRET:ci &
          WRANGLER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/node/branding/branding-audit.js --url=http://127.0.0.1:8787 || (echo "Branding audit failed" && kill $WRANGLER_PID || true && exit 1)
          kill $WRANGLER_PID || true

      - name: Upload branding audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-audit-summary
          path: reports/branding-audit-summary.md
          retention-days: 7

      - name: Verify build outputs
        run: |
          ls -la dist/ || echo "No dist directory"
          ls -la dist-worker/ || echo "No dist-worker directory"

      - name: Check deployment conditions
        id: check-deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" && "${{ github.event_name }}" == "push" ]]; then
            echo "should-deploy-dev=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy-dev=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "should-deploy-prod=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy-prod=false" >> $GITHUB_OUTPUT
          fi

  deploy-dev:
    if: needs.test.outputs.should-deploy-dev == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline
          cd scripts/node && npm ci --prefer-offline
          cd ../..
          npm install lightningcss-linux-x64-gnu @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --save-optional

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/
            dist-worker/
            node_modules/.cache/
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*', 'scripts/**/*') }}

      - name: Build for development
        run: npm run build
        env:
          NODE_ENV: development

      - name: Deploy to Cloudflare Workers (Development)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env development
          packageManager: npm

  deploy-prod:
    if: needs.test.outputs.should-deploy-prod == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline
          cd scripts/node && npm ci --prefer-offline
          cd ../..
          npm install lightningcss-linux-x64-gnu @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --save-optional

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/
            dist-worker/
            node_modules/.cache/
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*', 'scripts/**/*') }}

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          packageManager: npm

      - name: Purge Cloudflare Cache (Production)
        run: |
          node scripts/node/deploy/cloudflare-purge-cache.js \
            --everything \
            --zone-name andernet.dev \
            --api-token "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        env:
          NODE_ENV: production
