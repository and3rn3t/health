name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'ios/**', 'LICENSE']

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-pnpm

      - name: Build
        env:
          CI: 'true'
          NODE_ENV: production
        run: pnpm run build

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .lighthouserc.json

      - name: Bundle size check
        run: node scripts/ci/check-bundle-size.mjs

      - name: Post Lighthouse results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const links = ${{ steps.lhci.outputs.links }};
            const url = Object.values(links || {})[0] || 'N/A';
            const body = [
              '### Lighthouse CI Results',
              '',
              `**Report**: ${url}`,
              '',
              '| Category | Threshold |',
              '|----------|-----------|',
              '| Performance | >= 85 |',
              '| Accessibility | >= 90 |',
              '| Best Practices | >= 90 |',
              '| SEO | >= 80 |',
              '',
              `**Status**: ${{ steps.lhci.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body?.includes('### Lighthouse CI Results') &&
              c.user?.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
