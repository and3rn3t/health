name: Core CI Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Type Check
        run: npx tsc --noEmit
      - name: Build App
        run: npm run build
      - name: Build Worker (optional)
        run: npm run build:worker || echo "Skipping worker build"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/**
            dist-worker/**
          if-no-files-found: warn

  lint_test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Lint
        run: npm run lint || true
      - name: Unit Tests
        run: npm test -- --reporter=verbose || true

  performance_slo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Performance SLO Probe
        run: npm run ci:perf-slo || true
      - name: Upload Performance SLO Report
        uses: actions/upload-artifact@v4
        with:
          name: perf-slo-report
          path: reports/perf-slo.json
          if-no-files-found: warn

  bundle_threshold:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Build (reuse)
        run: npm run build || echo "build skipped"
      - name: Verify Bundle Thresholds
        run: npm run ci:bundle-threshold || true
      - name: Upload Bundle Threshold Report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-threshold-report
          path: reports/bundle-threshold.json
          if-no-files-found: warn

  bundle_drift:
    runs-on: ubuntu-latest
    needs: bundle_threshold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Ensure Build Exists
        run: |
          if [ ! -d dist ]; then npm run build; fi
      - name: Bundle Drift Comparison
        run: npm run ci:bundle-drift || true
      - name: Upload Bundle Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-drift-report
          path: reports/bundle-drift.json
          if-no-files-found: warn

  privacy_guard:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Privacy Guard
        run: npm run ci:privacy || true

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Build Worker (fallback to app)
        run: npm run build:worker || npm run build
      - name: Smoke
        run: npm run ci:smoke || true
      - name: Branding Audit (local)
        run: node scripts/node/branding/branding-audit.js --local --url=http://127.0.0.1:8787 || true
      - name: Upload Branding Audit Summary
        uses: actions/upload-artifact@v4
        with:
          name: branding-audit-summary
          path: reports/branding-audit-summary.md
          if-no-files-found: warn
      - name: WebSocket Resilience Test
        run: node scripts/node/test/test-websocket-reconnect.js --backendUrl=wss://health.andernet.dev/ws --maxReconnectMs=6000 || true

  secrets_rotation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Secret Rotation Check
        run: npm run ci:secrets || true

  ws_schema_drift:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - name: WebSocket Schema Drift
        run: npm run ci:ws-schema || true
      - name: Upload WS Schema Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports/ws-schema-drift.json
          if-no-files-found: warn

  summary:
    runs-on: ubuntu-latest
    needs:
      - build
      - lint_test
      - performance_slo
      - bundle_threshold
      - bundle_drift
      - privacy_guard
      - smoke
      - secrets_rotation
      - ws_schema_drift
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download Bundle Threshold Report
        uses: actions/download-artifact@v4
        with:
          name: bundle-threshold-report
          path: reports
        continue-on-error: true
      - name: Download Bundle Drift Report
        uses: actions/download-artifact@v4
        with:
          name: bundle-drift-report
          path: reports
        continue-on-error: true
      - name: Download Perf SLO Report
        uses: actions/download-artifact@v4
        with:
          name: perf-slo-report
          path: reports
        continue-on-error: true
      - name: Download WS Schema Drift Report
        uses: actions/download-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports
        continue-on-error: true
      - name: Download Branding Summary (optional)
        uses: actions/download-artifact@v4
        with:
          name: branding-audit-summary
          path: reports
        continue-on-error: true
      - name: Generate CI Scorecard
        run: |
          node scripts/ci/ci-scorecard.mjs \
            --lint='${{ needs.lint_test.result }}' \
            --bundle='${{ needs.bundle_threshold.result }}' \
            --drift='${{ needs.bundle_drift.result }}' \
            --privacy='${{ needs.privacy_guard.result }}' \
            --smoke='${{ needs.smoke.result }}' \
            --secrets='${{ needs.secrets_rotation.result }}' \
            --ws='${{ needs.ws_schema_drift.result }}' \
            --perf='${{ needs.performance_slo.result }}'
      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-scorecard
          path: reports/ci-scorecard.md
          if-no-files-found: warn
      - name: Enforce Minimal Gating
        run: |
          echo "Lint/Test: ${{ needs.lint_test.result }}"
          echo "Perf SLO: ${{ needs.performance_slo.result }}"
          echo "Bundle Threshold: ${{ needs.bundle_threshold.result }}"
          echo "Bundle Drift: ${{ needs.bundle_drift.result }}"
          echo "Privacy Guard: ${{ needs.privacy_guard.result }}"
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Secrets Rotation: ${{ needs.secrets_rotation.result }}"
          echo "WS Schema Drift: ${{ needs.ws_schema_drift.result }}"
          if [ "${{ needs.lint_test.result }}" != 'success' ]; then echo 'Lint/Test failed'; exit 1; fi
          if [ "${{ needs.performance_slo.result }}" != 'success' ]; then echo 'Perf SLO failed'; exit 1; fi
