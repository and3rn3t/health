name: API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/worker/routes/**'
      - 'schemas/**'
      - '.github/workflows/api-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build API Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-pnpm

      - name: Generate OpenAPI spec
        run: |
          node scripts/ci/check-openapi-drift.mjs --generate 2>/dev/null || true
          # Fallback: use committed spec if generation fails
          if [ ! -f .openapi-spec.tmp.json ]; then
            echo "Using committed OpenAPI spec"
            cp schemas/openapi.json .openapi-spec.tmp.json 2>/dev/null || echo '{}' > .openapi-spec.tmp.json
          fi

      - name: Build Swagger UI
        run: |
          mkdir -p api-docs
          cat > api-docs/index.html << 'SWAGGER_HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>VitalSense API Documentation</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
            <style>
              body { margin: 0; background: #fafafa; }
              .swagger-ui .topbar { display: none; }
              .swagger-ui .info .title { font-size: 2rem; }
            </style>
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              SwaggerUIBundle({
                url: './openapi.json',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
                layout: 'StandaloneLayout',
              });
            </script>
          </body>
          </html>
          SWAGGER_HTML

          cp .openapi-spec.tmp.json api-docs/openapi.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: api-docs/

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
