name: Nightly Security & Static Deep Scan

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-deep-scan
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sonar: ${{ steps.sonar_token.outputs.present }}
    steps:
      - name: Sonar Token Present
        id: sonar_token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then echo "present=true" >> $GITHUB_OUTPUT; else echo "present=false" >> $GITHUB_OUTPUT; fi

  semgrep:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
        continue-on-error: true
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  sonar:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.sonar == 'true'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || (corepack enable && pnpm install)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  license_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: License & Security Reports
        run: |
          mkdir -p reports
          pnpm add -D license-checker || true
          npx license-checker --json > reports/licenses.json || echo '{}' > reports/licenses.json
          pnpm audit --json > reports/pnpm-audit.json || echo '{}' > reports/pnpm-audit.json
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-security-reports
          path: reports
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: [semgrep, sonar, license_audit]
    if: always()
    steps:
      - name: Nightly Summary
        run: |
          echo '## Nightly Security & Static Scan' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '- Semgrep: ${{ needs.semgrep.result }}' >> $GITHUB_STEP_SUMMARY
          echo '- Sonar: ${{ needs.sonar.result || 'skipped' }}' >> $GITHUB_STEP_SUMMARY
          echo '- License/Audit: ${{ needs.license_audit.result }}' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Non-blocking workflow; investigate failures manually.' >> $GITHUB_STEP_SUMMARY
