name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to deploy (optional, will create tag if provided and not existing)'
        required: false
      force:
        description: 'Force deploy even if previous run failed (true/false)'
        required: false
        default: 'false'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  deployments: write
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  prepare:
    name: Prepare / Validate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -e
          INPUT_VERSION='${{ github.event.inputs.version }}'
          if [ -z "$INPUT_VERSION" ]; then
            # derive date-based pre-release if none supplied
            INPUT_VERSION="v$(date -u +%Y.%m.%d).0"
          fi
          echo "Resolved version: $INPUT_VERSION"
          echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
      - name: Check previous main CI
        id: gate
        run: |
          set -e
          FORCE='${{ github.event.inputs.force }}'
          if [ "$FORCE" = 'true' ]; then echo 'Forced deploy overriding gates'; echo 'proceed=true' >> $GITHUB_OUTPUT; exit 0; fi
          echo 'Verifying latest main branch CI summary succeeded...'
          # query last workflow run for ci-core on main
          curl -sSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci-core.yml/runs?branch=main&status=success&per_page=1" > runs.json || true
          OK=$(node -e "const f=require('./runs.json');process.stdout.write(f.total_count>0?'true':'false')")
          if [ "$OK" = 'true' ]; then echo 'proceed=true' >> $GITHUB_OUTPUT; else echo 'No successful main CI run found'; echo 'proceed=false' >> $GITHUB_OUTPUT; fi
      - name: Summary Gate
        run: |
          if [ '${{ steps.gate.outputs.proceed }}' != 'true' ]; then echo 'Gating failed - aborting'; exit 1; fi

  build_worker_app:
    name: Build (App + Worker)
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Docker build artifacts
        id: check-docker
        run: |
          # Check if we can use Docker build from previous workflow
          if gh run list --workflow=docker-build.yml --limit=1 --json conclusion,headSha --jq '.[0] | select(.conclusion=="success" and .headSha=="${{ github.sha }}")' 2>/dev/null; then
            echo "docker_available=true" >> $GITHUB_OUTPUT
            echo "✅ Docker build artifacts available"
          else
            echo "docker_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Using traditional build (Docker build not available)"
          fi
        continue-on-error: true

      - name: Build with Docker (if available)
        id: docker-build
        if: steps.check-docker.outputs.docker_available == 'true'
        run: |
          echo "🐳 Building with Docker..."
          docker build -f Dockerfile.build -t vitalsense:build .
          docker create --name artifacts vitalsense:build
          docker cp artifacts:/build-output/dist ./dist
          docker cp artifacts:/build-output/dist-worker ./dist-worker
          docker rm artifacts
          echo "✅ Docker build complete"
        continue-on-error: true

      - name: Setup Node & pnpm (fallback)
        if: steps.docker-build.outcome == 'failure' || steps.check-docker.outputs.docker_available != 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Install deps (fallback)
        if: steps.docker-build.outcome == 'failure' || steps.check-docker.outputs.docker_available != 'true'
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build web app (fallback)
        if: steps.docker-build.outcome == 'failure' || steps.check-docker.outputs.docker_available != 'true'
        run: pnpm run build

      - name: Build worker (fallback)
        if: steps.docker-build.outcome == 'failure' || steps.check-docker.outputs.docker_available != 'true'
        run: pnpm run build:worker || echo 'Worker build optional'
      - name: Verify advanced websocket worker source
        run: |
          set -e
          echo "Verifying advanced websocket worker source file..."
          if [ ! -f "src/workers/vitalsense-websocket-advanced.ts" ]; then
            echo "Error: Source file not found"
            exit 1
          fi
          # Verify the class export exists in source
          if ! grep -q "export class VitalSenseAdvancedWebSocketDO" src/workers/vitalsense-websocket-advanced.ts; then
            echo "Error: Source file does not contain VitalSenseAdvancedWebSocketDO export"
            exit 1
          fi
          echo "✅ Advanced websocket worker source verified"
      - name: Generate integrity manifest
        run: |
          set -e
          mkdir -p integrity
          if [ -d dist ]; then
            (find dist -type f -print0 | xargs -0 -r sha256sum) > integrity/dist.sha256 || true
          fi
          if [ -d dist-worker ]; then
            (find dist-worker -type f -print0 | xargs -0 -r sha256sum) > integrity/dist-worker.sha256 || true
          fi
          cat integrity/dist.sha256 integrity/dist-worker.sha256 2>/dev/null > integrity/combined.sha256 || true
          echo "Integrity manifest generated:"; ls -1 integrity || true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-build-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          retention-days: 5
          path: |
            dist/**
            dist-worker/**
            coverage/coverage-summary.json
            integrity/**

  deploy:
    name: Deploy to Production
    needs: [prepare, build_worker_app]
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://health.andernet.dev
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Install deps (including dev dependencies for wrangler)
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-build-${{ needs.prepare.outputs.version }}
          path: .
      - name: Verify integrity manifest
        run: |
          set -e
          if [ -f integrity/combined.sha256 ]; then
            echo "Verifying artifact integrity..."
            TMP_ALL=$(mktemp)
            if [ -d dist ]; then (find dist -type f -print0 | xargs -0 -r sha256sum) > dist.hashes || true; fi
            if [ -d dist-worker ]; then (find dist-worker -type f -print0 | xargs -0 -r sha256sum) > dist-worker.hashes || true; fi
            cat dist.hashes dist-worker.hashes 2>/dev/null | sort > "$TMP_ALL"
            sort integrity/combined.sha256 > integrity/combined.sorted
            if ! diff -u integrity/combined.sorted "$TMP_ALL"; then
              echo "Integrity mismatch detected" >&2
              exit 1
            fi
            echo "Integrity verified ✅"
          else
            echo "No integrity manifest present (skipping check)."
          fi
      - name: Deploy main worker (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; fi
          npx wrangler deploy --env production || { echo 'Wrangler deploy failed'; exit 1; }
      - name: Deploy advanced websocket worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; fi
          # Deploy using TypeScript source (Wrangler will compile and preserve exports)
          # Migration v1 has been applied, so normal deployment is fine
          echo "Deploying advanced websocket worker (dev)..."
          npx wrangler deploy --env advanced-websocket-dev || { echo 'Advanced websocket worker deploy (dev) failed'; exit 1; }
          echo "Deploying advanced websocket worker (prod)..."
          npx wrangler deploy --env advanced-websocket-prod || { echo 'Advanced websocket worker deploy (prod) failed'; exit 1; }
      - name: Post-deploy canary
        run: |
          set -e
          BASE="https://health.andernet.dev"
          echo "GET $BASE/health" && curl -fsS "$BASE/health" -o /dev/null
          echo "GET $BASE" && curl -fsS "$BASE" -o /dev/null
          echo 'Canary OK'
      - name: Create tag if missing
        if: startsWith(github.ref, 'refs/tags/') == false
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git tag ${{ needs.prepare.outputs.version }}
          git push origin ${{ needs.prepare.outputs.version }} || echo 'Tag push failed (maybe exists)'
      - name: Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Production Deploy ${{ needs.prepare.outputs.version }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deployment summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ✅ Success" >> $GITHUB_STEP_SUMMARY

  skip_notice:
    name: Skipped (Gating Failed)
    needs: prepare
    if: needs.prepare.outputs.proceed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '## Production Deploy Skipped' >> $GITHUB_STEP_SUMMARY
          echo 'Gating conditions not met (recent successful main CI run missing). Use force=true to override.' >> $GITHUB_STEP_SUMMARY
