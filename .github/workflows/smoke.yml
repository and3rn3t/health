name: Smoke Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/node/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/node/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config*.ts'
      - 'tsconfig*.json'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline
          cd scripts/node && npm ci --prefer-offline
          npm install lightningcss-linux-x64-gnu @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --save-optional
          cd ..
          # Use npx for wrangler to avoid local peer dependency conflicts

      - name: Build application
        run: npm run build

      - name: Start Worker (wrangler dev --local)
        run: |
          # Use explicit wrangler version via npx to avoid peer dependency resolution against the repo
          npx -y wrangler@4.38.0 --version
          # Start local Worker in background on 8787 with a CI-only secret
          timeout 120s bash -c 'until npx -y wrangler@4.38.0 dev --env development --local \
            --port 8787 \
            --var DEVICE_JWT_SECRET:ci \
            > wrangler.log 2>&1 & echo $! > wrangler.pid && \
            until curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; do sleep 1; done; do
            echo "Retrying wrangler start..."; sleep 2
          done'

          # Final health check
          curl -fsS http://127.0.0.1:8787/health || (echo "Worker failed to start"; cat wrangler.log; exit 1)

      - name: Run health checks
        run: |
          # Use Node.js script for better cross-platform compatibility
          node scripts/node/health/simple-probe.js --port 8787 --timeout 30

      - name: Branding audit (combined)
        run: |
          node scripts/node/branding/branding-audit.js --url=http://127.0.0.1:8787 || (echo "Branding audit failed" && exit 1)

      - name: Teardown and logs
        if: always()
        run: |
          if [ -f wrangler.pid ]; then
            kill $(cat wrangler.pid) 2>/dev/null || true
            rm -f wrangler.pid
          fi
          if [ -f wrangler.log ]; then
            echo "--- Wrangler Logs ---"
            cat wrangler.log
          fi
