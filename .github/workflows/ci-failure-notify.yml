name: CI Failure Notification

on:
  workflow_run:
    workflows: ['CI', 'iOS CI']
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  notify-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 5
    steps:
      - name: Create GitHub Issue for CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const title = `CI failure: ${run.name} on ${run.head_branch}`;
            const body = [
              `### CI Failure Alert`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Workflow** | ${run.name} |`,
              `| **Branch** | \`${run.head_branch}\` |`,
              `| **Commit** | [\`${run.head_sha.slice(0, 7)}\`](${run.html_url}) |`,
              `| **Run** | [View logs](${run.html_url}) |`,
              `| **Triggered by** | @${run.actor.login} |`,
              `| **Time** | ${new Date(run.updated_at).toISOString()} |`,
              '',
              'Please investigate and fix the failure.',
            ].join('\n');

            // Check for existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Another failure: [Run #${run.run_number}](${run.html_url})`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['ci-failure', 'bug'],
              });
            }
