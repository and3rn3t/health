name: Project Backfill

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  projects: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PROJECT_TOKEN
        run: |
          if [ -z "${{ secrets.PROJECT_TOKEN }}" ]; then
            echo "PROJECT_TOKEN secret is not set. Create a PAT (classic) with scopes: repo, project, read:org (if org project)."
            exit 1
          fi
      - name: Backfill open issues into project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = 'and3rn3t';
            const title = 'Health Roadmap';
            const gql = String.raw;
            async function getProject() {
              const q = gql`
                query($owner: String!, $title: String!) {
                  user(login: $owner) { projectV2(title: $title) { id title } }
                  organization(login: $owner) { projectV2(title: $title) { id title } }
                }
              `;
              const data = await github.graphql(q, { owner, title });
              return (data.user?.projectV2 || data.organization?.projectV2) ?? null;
            }
            const project = await getProject();
            if (!project) {
              core.setFailed(`Project "${title}" not found for owner "${owner}".`);
              return;
            }
            const projectId = project.id;
            // Fetch open issues (paginate)
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            core.info(`Found ${issues.length} open issues`);
            // Add each to project
            const addMutation = gql`mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) { item { id } }
            }`;
            let added = 0;
            for (const iss of issues) {
              if (!iss.node_id) continue;
              try {
                await github.graphql(addMutation, { projectId, contentId: iss.node_id });
                added++;
              } catch (e) {
                core.info(`Skip #${iss.number}: ${e.message}`);
              }
            }
            core.info(`Backfill complete: added ${added} items.`);
