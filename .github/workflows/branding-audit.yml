name: Branding Audit

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/node/branding/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/branding-audit.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/node/branding/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/branding-audit.yml'
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: branding-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Branding Audit (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [local, production]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline

      - name: Start local Worker (only for local mode)
        if: matrix.mode == 'local'
        run: |
          npx -y wrangler@4.38.0 dev --env development --local --port 8787 --var DEVICE_JWT_SECRET:ci &
          echo $! > wrangler.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "Worker ready"; break;
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/health || (echo "Worker failed to become ready" && cat wrangler.pid && exit 1)

      - name: Run branding audit (combined)
        env:
          FORCE_COLOR: '3'
        run: |
          if [ "${{ matrix.mode }}" = "local" ]; then
            node scripts/node/branding/branding-audit.js --local --url=http://127.0.0.1:8787
          else
            node scripts/node/branding/branding-audit.js --url=https://health.andernet.dev
          fi

      - name: Upload branding audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-audit-${{ matrix.mode }}
          path: reports/branding-audit-summary.md
          retention-days: 7

      - name: Teardown local worker
        if: always() && matrix.mode == 'local'
        run: |
          if [ -f wrangler.pid ]; then
            kill $(cat wrangler.pid) 2>/dev/null || true
            rm wrangler.pid
          fi
