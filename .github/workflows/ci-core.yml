name: Core CI Pipeline

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: manual

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Type Check
        run: pnpm exec tsc --noEmit
      - name: Build App
        run: pnpm run build
      - name: Build Worker (optional)
        run: pnpm run build:worker || echo "Skipping worker build"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/**
            dist-worker/**
          if-no-files-found: warn
          retention-days: 3

  lint_test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint || true
      - name: Unit Tests
        run: pnpm test -- --reporter=verbose || true

  bundle_threshold:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .
        continue-on-error: true
      - name: Fallback Build (if artifacts missing)
        run: |
          if [ ! -d dist ]; then echo "dist not found – fallback build"; pnpm run build; fi
      - name: Verify Bundle Thresholds
        run: pnpm run ci:bundle-threshold
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-threshold-report
          path: reports/bundle-threshold.json
          if-no-files-found: error

  bundle_drift:
    runs-on: ubuntu-latest
    needs: bundle_threshold
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .
        continue-on-error: true
      - name: Fallback Build (if artifacts missing)
        run: |
          if [ ! -d dist ]; then echo "dist not found – fallback build"; pnpm run build; fi
      - name: Bundle Drift
        run: pnpm run ci:bundle-drift
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-drift-report
          path: reports/bundle-drift.json
          if-no-files-found: error

  privacy_guard:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Privacy Guard
        run: pnpm run ci:privacy

  smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .
        continue-on-error: true
      - name: Ensure Build Assets (fallback)
        run: |
          if [ ! -d dist ]; then echo "dist missing – rebuilding"; pnpm run build; fi
          if [ ! -d dist-worker ]; then echo "dist-worker missing – attempting worker build"; pnpm run build:worker || echo "Worker build optional"; fi
      - name: Smoke
        run: pnpm run ci:smoke
      - name: Branding Audit (local)
        run: node scripts/node/branding/branding-audit.js --local --url=http://127.0.0.1:8787 || true
      - name: Branding Audit (production)
        run: node scripts/node/branding/branding-audit.js --url=https://health.andernet.dev || true
      - name: Upload Branding Audit Summary
        uses: actions/upload-artifact@v4
        with:
          name: branding-audit-summary
          path: reports/branding-audit-summary.md
          if-no-files-found: warn
      - name: WebSocket Resilience Test
        run: node scripts/node/test/test-websocket-reconnect.js --backendUrl=wss://health.andernet.dev/ws --maxReconnectMs=6000 || true

  security_scan:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Security Audit (soft fail)
        run: pnpm audit --prod --audit-level=moderate || true
      - name: Install license-checker
        run: pnpm add -D license-checker || true
      - name: License Compliance (soft fail)
        run: npx license-checker --summary || true
      - name: Collect Security Report
        if: always()
        run: |
          mkdir -p reports
          pnpm audit --json > reports/pnpm-audit.json 2>/dev/null || echo '{}' > reports/pnpm-audit.json
      - name: Upload Security Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: reports/pnpm-audit.json
          if-no-files-found: warn

  code_quality:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Lint (JSON + text)
        run: |
          mkdir -p reports
          pnpm run lint || true
          pnpm run lint -- --format json --output-file reports/eslint-report.json || true
      - name: Unit Tests w/ Coverage (soft)
        run: pnpm run test:coverage || true
      - name: Upload Code Quality Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality
          path: |
            coverage/
            reports/eslint-report.json
          if-no-files-found: warn

  semgrep_scan:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan (soft)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  sonar_scan:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: SonarCloud Scan (soft)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  dependency_review:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        continue-on-error: true

  secrets_rotation:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Secret Rotation Check
        run: pnpm run ci:secrets

  ws_schema_drift:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: WebSocket Schema Drift
        run: pnpm run ci:ws-schema
      - name: Upload WS Schema Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports/ws-schema-drift.json
          if-no-files-found: error

  performance_slo:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Performance SLO Probe
        run: pnpm run ci:perf-slo
      - name: Upload Performance SLO Report
        uses: actions/upload-artifact@v4
        with:
          name: perf-slo-report
          path: reports/perf-slo.json
          if-no-files-found: error

  summary:
    runs-on: ubuntu-latest
    needs:
      - lint_test
      - bundle_threshold
      - bundle_drift
      - privacy_guard
      - smoke
      - secrets_rotation
      - ws_schema_drift
      - performance_slo
      - security_scan
      - code_quality
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Prepare Reports Dir
        run: mkdir -p reports
      - name: Download Bundle Threshold Report
        uses: actions/download-artifact@v4
        with:
          name: bundle-threshold-report
          path: reports
        continue-on-error: true
      - name: Download Bundle Drift Report
        uses: actions/download-artifact@v4
        with:
          name: bundle-drift-report
          path: reports
        continue-on-error: true
      - name: Download Perf SLO Report
        uses: actions/download-artifact@v4
        with:
          name: perf-slo-report
          path: reports
        continue-on-error: true
      - name: Download WS Schema Drift Report
        uses: actions/download-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports
        continue-on-error: true
      - name: Download Branding Summary (optional)
        uses: actions/download-artifact@v4
        with:
          name: branding-audit-summary
          path: reports
        continue-on-error: true
      - name: Generate CI Scorecard
        run: |
          node scripts/ci/ci-scorecard.mjs \
            --lint='${{ needs.lint_test.result }}' \
            --bundle='${{ needs.bundle_threshold.result }}' \
            --drift='${{ needs.bundle_drift.result }}' \
            --privacy='${{ needs.privacy_guard.result }}' \
            --smoke='${{ needs.smoke.result }}' \
            --secrets='${{ needs.secrets_rotation.result }}' \
            --ws='${{ needs.ws_schema_drift.result }}' \
            --perf='${{ needs.performance_slo.result }}'
      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-scorecard
          path: reports/ci-scorecard.md
          if-no-files-found: warn
      - name: Enforce Gating
        run: |
          echo "Lint/Test: ${{ needs.lint_test.result }}"
          echo "Bundle: ${{ needs.bundle_threshold.result }}"
          echo "Drift: ${{ needs.bundle_drift.result }}"
          echo "Privacy: ${{ needs.privacy_guard.result }}"
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Secrets: ${{ needs.secrets_rotation.result }}"
          echo "WS Schema: ${{ needs.ws_schema_drift.result }}"
          echo "Perf SLO: ${{ needs.performance_slo.result }}"
          echo "Security: ${{ needs.security_scan.result }}"
          echo "Code Quality: ${{ needs.code_quality.result }}"
          failures=0
          for r in "${{ needs.bundle_threshold.result }}" "${{ needs.bundle_drift.result }}" "${{ needs.privacy_guard.result }}" "${{ needs.smoke.result }}" "${{ needs.secrets_rotation.result }}" "${{ needs.ws_schema_drift.result }}" "${{ needs.performance_slo.result }}" "${{ needs.security_scan.result }}" "${{ needs.code_quality.result }}" "${{ needs.lint_test.result }}"; do
            if [ "$r" != 'success' ]; then failures=$((failures+1)); fi
          done
          if [ $failures -gt 0 ]; then echo "Gating failures: $failures"; exit 1; fi

  deploy:
    runs-on: ubuntu-latest
    needs: summary
    if: >-
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 
      needs.summary.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Deploy (develop)
        if: github.ref == 'refs/heads/develop'
        run: pnpm run deploy:dev
      - name: Deploy (main)
        if: github.ref == 'refs/heads/main'
        run: pnpm run deploy:prod
