          if-no-files-found: warn

  summary:
    runs-on: ubuntu-latest
    needs:
      - build
      - lint_test
      - performance_slo
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
