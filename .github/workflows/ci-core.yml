        uses: actions/download-artifact@v4
        with:
          name: perf-slo-report
          path: reports
        continue-on-error: true
      - name: Generate CI Scorecard
        run: |
          node scripts/ci/ci-scorecard.mjs \
            --lint='${{ needs.lint_test.result }}' \
            --bundle='success' \
            --drift='success' \
            --privacy='success' \
            --smoke='success' \
            --secrets='success' \
            --ws='success' \
            --perf='${{ needs.performance_slo.result }}'
      - name: Upload Scorecard
        uses: actions/upload-artifact@v4
        with:
          name: ci-scorecard
          path: reports/ci-scorecard.md
          if-no-files-found: warn
      - name: Enforce Minimal Gating
        run: |
          echo "Lint/Test: ${{ needs.lint_test.result }}"
          echo "Perf SLO: ${{ needs.performance_slo.result }}"
          if [ "${{ needs.lint_test.result }}" != 'success' ]; then exit 1; finame: Core CI Pipeline

