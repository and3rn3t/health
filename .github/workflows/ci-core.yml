name: Core CI Pipeline

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: manual

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type Check
        run: npx tsc --noEmit
      - name: Build App
        run: npm run build
      - name: Build Worker (optional)
        run: npm run build:worker || echo "Skipping worker build"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/**
            dist-worker/**
          if-no-files-found: warn
          retention-days: 3

  lint_test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        run: npm run lint || true
      - name: Unit Tests
        run: npm test -- --reporter=verbose || true

  bundle_threshold:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .
        continue-on-error: true
      - name: Fallback Build (if artifacts missing)
        run: |
          if [ ! -d dist ]; then echo "dist not found – fallback build"; npm run build; fi
      - name: Verify Bundle Thresholds
        run: npm run ci:bundle-threshold
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-threshold-report
          path: reports/bundle-threshold.json
          if-no-files-found: error

  bundle_drift:
    runs-on: ubuntu-latest
    needs: bundle_threshold
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .
        continue-on-error: true
      - name: Fallback Build (if artifacts missing)
        run: |
          if [ ! -d dist ]; then echo "dist not found – fallback build"; npm run build; fi
      - name: Bundle Drift
        run: npm run ci:bundle-drift
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-drift-report
          path: reports/bundle-drift.json
          if-no-files-found: error

  privacy_guard:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Privacy Guard
        run: npm run ci:privacy

  smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: .
        continue-on-error: true
      - name: Ensure Build Assets (fallback)
        run: |
          if [ ! -d dist ]; then echo "dist missing – rebuilding"; npm run build; fi
          if [ ! -d dist-worker ]; then echo "dist-worker missing – attempting worker build"; npm run build:worker || echo "Worker build optional"; fi
      - name: Smoke
        run: npm run ci:smoke
      - name: Branding Audit (local)
        run: node scripts/node/branding/branding-audit.js --local --url=http://127.0.0.1:8787 || true
      - name: Upload Branding Audit Summary
        uses: actions/upload-artifact@v4
        with:
          name: branding-audit-summary
          path: reports/branding-audit-summary.md
          if-no-files-found: warn
      - name: WebSocket Resilience Test
        run: node scripts/node/test/test-websocket-reconnect.js --backendUrl=wss://health.andernet.dev/ws --maxReconnectMs=6000 || true

  secrets_rotation:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Secret Rotation Check
        run: npm run ci:secrets

  ws_schema_drift:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: WebSocket Schema Drift
        run: npm run ci:ws-schema
      - name: Upload WS Schema Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports/ws-schema-drift.json
          if-no-files-found: error

  performance_slo:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Performance SLO Probe
        run: npm run ci:perf-slo
      - name: Upload Performance SLO Report
        uses: actions/upload-artifact@v4
        with:
          name: perf-slo-report
          path: reports/perf-slo.json
          if-no-files-found: error

  summary:
    runs-on: ubuntu-latest
    needs:
      - lint_test
      - bundle_threshold
      - bundle_drift
      - privacy_guard
      - smoke
      - secrets_rotation
      - ws_schema_drift
      - performance_slo
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prepare Reports Dir
        run: mkdir -p reports
      - name: Download Bundle Threshold Report
        uses: actions/download-artifact@v4
        with:
          name: bundle-threshold-report
          path: reports
        continue-on-error: true
      - name: Download Bundle Drift Report
        uses: actions/download-artifact@v4
        with:
          name: bundle-drift-report
          path: reports
        continue-on-error: true
      - name: Download Perf SLO Report
        uses: actions/download-artifact@v4
        with:
          name: perf-slo-report
          path: reports
        continue-on-error: true
      - name: Download WS Schema Drift Report
        uses: actions/download-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports
        continue-on-error: true
      - name: Download Branding Summary (optional)
        uses: actions/download-artifact@v4
        with:
          name: branding-audit-summary
          path: reports
        continue-on-error: true
      - name: Generate CI Scorecard
        run: |
          node scripts/ci/ci-scorecard.mjs \
            --lint='${{ needs.lint_test.result }}' \
            --bundle='${{ needs.bundle_threshold.result }}' \
            --drift='${{ needs.bundle_drift.result }}' \
            --privacy='${{ needs.privacy_guard.result }}' \
            --smoke='${{ needs.smoke.result }}' \
            --secrets='${{ needs.secrets_rotation.result }}' \
            --ws='${{ needs.ws_schema_drift.result }}' \
            --perf='${{ needs.performance_slo.result }}'
      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-scorecard
          path: reports/ci-scorecard.md
          if-no-files-found: warn
      - name: Enforce Gating
        run: |
          echo "Lint/Test: ${{ needs.lint_test.result }}"
          echo "Bundle: ${{ needs.bundle_threshold.result }}"
          echo "Drift: ${{ needs.bundle_drift.result }}"
          echo "Privacy: ${{ needs.privacy_guard.result }}"
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Secrets: ${{ needs.secrets_rotation.result }}"
          echo "WS Schema: ${{ needs.ws_schema_drift.result }}"
          echo "Perf SLO: ${{ needs.performance_slo.result }}"
          failures=0
          for r in "${{ needs.bundle_threshold.result }}" "${{ needs.bundle_drift.result }}" "${{ needs.privacy_guard.result }}" "${{ needs.smoke.result }}" "${{ needs.secrets_rotation.result }}" "${{ needs.ws_schema_drift.result }}" "${{ needs.performance_slo.result }}" "${{ needs.lint_test.result }}"; do
            if [ "$r" != 'success' ]; then failures=$((failures+1)); fi
          done
          if [ $failures -gt 0 ]; then echo "Gating failures: $failures"; exit 1; fi
