        uses: actions/upload-artifact@v4
        with:
          name: branding-audit-summary
          path: reports/branding-audit-summary.md
          if-no-files-found: warn
      - name: WebSocket Resilience Test
        run: node scripts/node/test/test-websocket-reconnect.js --backendUrl=wss://health.andernet.dev/ws --maxReconnectMs=6000

  bundle_drift:
    runs-on: ubuntu-latest
    needs: bundle_threshold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - name: Build (current) if needed
        run: |
          if [ ! -d dist ]; then npm run build; fi
      - name: Bundle Drift
        run: npm run ci:bundle-drift
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-drift-report
          path: reports/bundle-drift.json
          if-no-files-found: error

  secrets_rotation:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Secret Rotation Check
        run: npm run ci:secrets

  ws_schema_drift:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - name: WebSocket Schema Drift
        run: npm run ci:ws-schema
      - name: Upload WS Schema Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: ws-schema-drift-report
          path: reports/ws-schema-drift.json
          if-no-files-found: error

  performance_slo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline
      - name: Performance SLO Probe
        run: npm run ci:perf-slo
      - name: Upload Performance SLO Report
        uses: actions/upload-artifact@v4
        with:
          name: perf-slo-report
          path: reports/perf-slo.json
          if-no-files-found: error

  summary:
    runs-on: ubuntu-latest
    needs:
      [
        lint_test,
        bundle_threshold,
        bundle_drift,
        privacy_guard,
        smoke,
        secrets_rotation,
        ws_schema_drift,
        performance_slo,
      ]
    if: always()
    steps:
      - run: |
          echo "Lint/Test: ${{ needs.lint_test.result }}"
          echo "Bundle: ${{ needs.bundle_threshold.result }}"
          echo "Drift: ${{ needs.bundle_drift.result }}"
          echo "Privacy: ${{ needs.privacy_guard.result }}"
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Secrets: ${{ needs.secrets_rotation.result }}"
          echo "WS Schema: ${{ needs.ws_schema_drift.result }}"
          echo "Perf SLO: ${{ needs.performance_slo.result }}"
          if [ "${{ needs.bundle_threshold.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.bundle_drift.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.privacy_guard.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.smoke.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.secrets_rotation.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.ws_schema_drift.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.performance_slo.result }}" != 'success' ]; then exit 1; fi
          if [ "${{ needs.lint_test.result }}" != 'success' ]; then exit 1; fi
