name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'ios/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'ios/**', 'LICENSE']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast quality gates (parallel) ────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Config drift check
        run: pnpm run check:drift

      - name: OpenAPI spec drift check
        run: pnpm run check:openapi

      - name: Lint
        run: pnpm run lint

      - name: Security audit
        run: pnpm audit --audit-level=moderate || echo "::warning::Audit found vulnerabilities"

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Type Check
        run: pnpm run type-check

  # ── Unit tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Run ${{ matrix.suite }} tests
        run: |
          if [ "${{ matrix.suite }}" = "unit" ]; then
            pnpm run test:coverage
          else
            npx vitest run --config vitest.integration.config.ts
          fi
        env:
          CI: 'true'

      - name: Upload coverage to Codecov
        if: matrix.suite == 'unit' && always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: SonarCloud Scan
        if: matrix.suite == 'unit' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build (depends on quality gates) ─────────────────────────
  build:
    needs: [lint, type-check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm

      - name: Build
        env:
          CI: 'true'
          NODE_ENV: production
        run: pnpm run build:all

      - name: Verify build
        run: |
          test -d dist && echo "App build OK ($(du -sh dist | cut -f1))" || exit 1
          test -d dist-worker && echo "Worker build OK ($(du -sh dist-worker | cut -f1))" || exit 1

      - name: Bundle size report
        run: |
          node scripts/ci/check-bundle-size.mjs --update 2>&1 || echo "::warning::Bundle size check issue"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            dist-worker/
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy:prod

      - name: Post-deploy smoke test
        run: node scripts/deploy/smoke-test.mjs --env production
        timeout-minutes: 2

  # ── Preview deployment (PR only) ─────────────────────────────
  preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          output=$(npx wrangler deploy --env preview 2>&1)
          echo "$output"
          url=$(echo "$output" | grep -oP 'https://[^\s]+\.workers\.dev' | head -1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const body = [
              '### 🚀 Preview Deployment',
              '',
              `**URL**: ${url}`,
              `**Commit**: \`${context.sha.slice(0, 7)}\``,
              '',
              '| Endpoint | Link |',
              '|----------|------|',
              `| App | [Open](${url}) |`,
              `| Health Check | [/health](${url}/health) |`,
              `| API Docs | [/api/docs](${url}/api/docs) |`,
            ].join('\n');

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.includes('### 🚀 Preview Deployment') &&
              c.user?.login === 'github-actions[bot]'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
