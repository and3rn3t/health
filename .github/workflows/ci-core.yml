name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'ios/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'ios/**', 'LICENSE']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarCloud blame analysis
      - uses: ./.github/actions/setup-pnpm

      - name: Lint
        run: pnpm run lint

      - name: Security audit
        run: pnpm audit --audit-level=moderate || echo "::warning::Audit found vulnerabilities"

      - name: Type Check
        run: pnpm run type-check

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: SonarCloud Scan
        # Ensure Automatic Analysis is disabled in SonarCloud dashboard to avoid duplicate scans
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          CI: 'true'
          NODE_ENV: production
        run: pnpm run build

      - name: Verify build
        run: |
          test -d dist && echo "Build OK ($(du -sh dist | cut -f1))" || exit 1

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Build worker
        run: pnpm run build:worker

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy:prod
