  lint_test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run lint || true
      - run: npm test -- --reporter=verbose || true

  performance_slo:
