name: Docker Build & Cache

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registry'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (production)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          target: builder
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build Docker image (CI/CD) - Local Only
        id: build-local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.build
          push: false
          tags: vitalsense:build-local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          load: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build Docker image (CI/CD) - Push to Registry
        if: github.event_name != 'pull_request' && github.event.inputs.push != 'false'
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Extract build artifacts
        if: github.event_name != 'pull_request'
        run: |
          echo "📦 Extracting build artifacts..."
          
          # Use the locally loaded image (with -local suffix to avoid Docker Hub)
          IMAGE_TAG="vitalsense:build-local"
          
          if ! docker image inspect $IMAGE_TAG >/dev/null 2>&1; then
            echo "❌ Image $IMAGE_TAG not found. Available images:"
            docker images | grep -E "(vitalsense|health)" || docker images | head -10
            exit 1
          fi
          
          echo "✅ Using local image: $IMAGE_TAG"

          # Create container and extract artifacts
          CONTAINER_ID=$(docker create $IMAGE_TAG)

          # Extract artifacts
          echo "Extracting dist/..."
          docker cp $CONTAINER_ID:/build-output/dist ./dist 2>/dev/null || {
            echo "⚠️ dist/ not found in /build-output, checking /app/dist..."
            docker cp $CONTAINER_ID:/app/dist ./dist 2>/dev/null || {
              echo "❌ dist/ not found in container"
              docker run --rm $IMAGE_TAG ls -la /build-output 2>/dev/null || true
              docker run --rm $IMAGE_TAG ls -la /app 2>/dev/null || true
              exit 1
            }
          }

          echo "Extracting dist-worker/..."
          docker cp $CONTAINER_ID:/build-output/dist-worker ./dist-worker 2>/dev/null || {
            echo "⚠️ dist-worker/ not found in /build-output, checking /app/dist-worker..."
            docker cp $CONTAINER_ID:/app/dist-worker ./dist-worker 2>/dev/null || {
              echo "⚠️ dist-worker/ not found (optional)"
            }
          }

          # Clean up container
          docker rm $CONTAINER_ID

          # Verify artifacts
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            echo "✅ dist/ extracted ($(du -sh dist | cut -f1))"
            ls -la dist | head -5
          else
            echo "❌ dist/ is empty or missing"
            exit 1
          fi

          if [ -d dist-worker ] && [ "$(ls -A dist-worker)" ]; then
            echo "✅ dist-worker/ extracted ($(du -sh dist-worker | cut -f1))"
          fi

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-artifacts
          path: |
            dist/**
            dist-worker/**
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images built:**" >> $GITHUB_STEP_SUMMARY
          echo "- Production: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Build: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
            echo "- dist/: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
            [ -d dist-worker ] && echo "- dist-worker/: $(du -sh dist-worker | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
