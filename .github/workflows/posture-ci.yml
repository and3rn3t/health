name: Posture CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/Andernet-Posture/**'
  pull_request:
    branches: [main]
    paths:
      - 'ios/Andernet-Posture/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "Andernet Posture"
  PROJECT: "Andernet Posture.xcodeproj"
  DESTINATION: "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest"
  XCODE_PATH: /Applications/Xcode_26.2.app/Contents/Developer
  WORK_DIR: ios/Andernet-Posture

defaults:
  run:
    working-directory: ios/Andernet-Posture

jobs:
  # ─── Fast PR feedback: unit tests only (~1-2 min) ───
  unit-tests:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Andernet-Posture/**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing "Andernet PostureTests" \
            -resultBundlePath UnitTestResults.xcresult \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTestResults
          path: ${{ env.WORK_DIR }}/UnitTestResults.xcresult

  # ─── PR smoke check: 7 critical UI tests (~2 min) ───
  smoke-ui-tests:
    name: Smoke UI Tests
    runs-on: macos-15
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Andernet-Posture/**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run smoke UI tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -testPlan SmokeTests \
            -resultBundlePath SmokeTestResults.xcresult \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Upload smoke test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SmokeTestResults
          path: ${{ env.WORK_DIR }}/SmokeTestResults.xcresult

  # ─── Main branch: full regression suite with coverage ───
  full-suite:
    name: Full Test Suite
    runs-on: macos-15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Andernet-Posture/**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Run full test suite
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -testPlan FullSuite \
            -enableCodeCoverage YES \
            -resultBundlePath FullSuiteResults.xcresult \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FullSuiteResults
          path: ${{ env.WORK_DIR }}/FullSuiteResults.xcresult

  # ─── Lint (all pushes and PRs) ───
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint --strict
