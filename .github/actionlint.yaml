# actionlint config. reviewdog's actionlint action reports every finding as an
# error, so pre-existing shellcheck style findings in the iOS/CI scripts would
# fail the check. Only these two rules are ignored; everything else still runs.
# TODO: quote the variables in ios-build.yml / ios-ci.yml and drop SC2086.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:'
      - 'shellcheck reported issue in this script: SC2034:'
