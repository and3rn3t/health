name: 'Setup Node & pnpm (Pinned)'
description: 'Node setup via .nvmrc, Corepack + pinned pnpm, store cache, and frozen-lockfile install'
inputs:
  working-directory:
    description: 'Directory to run setup in'
    required: false
    default: '.'
  skip-install:
    description: 'Skip pnpm install (default: false)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Setup Node (actions/setup-node)
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        # NOTE: pnpm cache disabled here because setup-node attempts to invoke pnpm
        # when cache=pnpm is set, but pnpm is not yet available until after Corepack
        # is enabled & prepared. We can add a dedicated cache step later if needed.
    - name: Enable Corepack
      shell: bash
      run: corepack enable || true
    - name: Restore pnpm store (cache)
      id: pnpm-cache
      shell: bash
      run: |
        set -e
        STORE_PATH=$(node -e "process.stdout.write(require('path').join(process.env.HOME,'.pnpm-store'))")
        echo "Computed store path: $STORE_PATH"
        echo "store-path=$STORE_PATH" >> $GITHUB_OUTPUT
      env:
        # Allow future extension
        PNPM_HOME: ~/.pnpm
    - name: Cache pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-cache.outputs.store-path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-
    - name: Prepare pinned pnpm version
      id: prep
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -e
        if [ ! -f package.json ]; then echo 'package.json not found in working directory'; exit 0; fi
        VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
        echo "Preparing pnpm@${VERSION}"
        if ! corepack prepare pnpm@${VERSION} --activate; then
          echo "corepack prepare failed, installing fallback pnpm@${VERSION} via npm"
          npm i -g pnpm@${VERSION}
        fi
        if ! command -v pnpm >/dev/null 2>&1; then
          echo "pnpm still not found after corepack + fallback install" >&2
          exit 1
        fi
        echo "pnpm version: $(pnpm -v)"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    - name: Show pnpm store path (debug)
      shell: bash
      run: pnpm store path || true
    - name: Install dependencies
      if: ${{ inputs.skip-install == 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
