name: 'Setup Node & pnpm (Pinned)'
description: 'Standard Node setup using .nvmrc, enable Corepack, prepare pinned pnpm version from package.json'
inputs:
  working-directory:
    description: 'Directory to run setup in'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: Use working directory
      shell: bash
      run: |
        echo "Working directory: ${{ inputs.working-directory }}"
    - name: Setup Node (actions/setup-node)
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Enable Corepack
      shell: bash
      run: corepack enable || true
    - name: Prepare pinned pnpm version
      id: prep
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -e
        if [ ! -f package.json ]; then echo 'package.json not found in working directory'; exit 0; fi
        VERSION=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
        echo "Preparing pnpm@${VERSION}"
        corepack prepare pnpm@${VERSION} --activate || true
        pnpm -v
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    - name: Show pnpm store path (debug)
      shell: bash
      run: pnpm store path || true
